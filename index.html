<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Coffee</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7efe5;
            color: #3b2920;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 850px;
            background: #fffaf4;
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(59, 41, 32, 0.15);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8a6552;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .item {
            background: #ead6c2;
            padding: 15px 22px;
            border-radius: 15px;
            font-weight: bold;
        }

        .promo {
            background: #3b2920;
            color: white;
            padding: 18px;
            border-radius: 15px;
            font-size: 17px;
        }

        footer {
            margin-top: 25px;
            font-size: 14px;
            color: #8a6552;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="icon">☕</div>

        <h1>Cloud Coffee</h1>

        <p class="subtitle">
            Tu café favorito, ahora de forma más simple.
        </p>

        <section class="menu">
            <div class="item">☕ Café</div>
            <div class="item">🥐 Pan dulce</div>
            <div class="item">🍰 Postres</div>
        </section>

        <div class="promo">
            ✨ Promociones especiales en tus pedidos
        </div>

        <footer>
            Pedidos fáciles · Comandas digitales · Cloud Coffee
        </footer>

    </main>

</body>
</html>
